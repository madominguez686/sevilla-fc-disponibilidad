<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disponibilidad Sevilla FC · LFP27.15</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --sfc: #d50032;
      --sfc-dark: #9e0024;
      --sfc-soft: #fff1f4;
      --ok: #059669;
      --ok-soft: #ecfdf5;
      --warn: #d97706;
      --warn-soft: #fffbeb;
      --bad: #dc2626;
      --bad-soft: #fef2f2;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: linear-gradient(180deg, #e5e7eb 0%, var(--bg) 220px);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px 40px;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 4px 18px rgba(17, 24, 39, 0.05);
    }

    .header-sfc {
      background: linear-gradient(135deg, var(--sfc) 0%, var(--sfc-dark) 100%);
      color: #fff;
      border: none;
      padding: 18px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    .badge-confirmado {
      background: #dcfce7;
      color: #065f46;
    }

    .badge-estimado {
      background: #fef3c7;
      color: #92400e;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.92;
    }

    .match-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .match-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .doors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .door-pill {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }

    .door-pill span {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .door-pill strong {
      display: block;
      font-size: 14px;
      margin-top: 2px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #eef0f3;
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 9px 10px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }

    .locked-ficha {
      background: #f9fafb;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .locked-ficha strong {
      display: block;
      font-size: 15px;
    }

    .locked-ficha small {
      color: var(--muted);
      font-size: 12px;
    }

    .lock-tag {
      background: #e5e7eb;
      color: #1f2937;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .choice-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .choice-btn {
      padding: 13px 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .choice-btn.active-yes {
      border-color: var(--ok);
      background: var(--ok-soft);
      color: #065f46;
    }

    .choice-btn.active-no {
      border-color: var(--bad);
      background: var(--bad-soft);
      color: #991b1b;
    }

    .margins {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .margin-btn {
      padding: 9px 4px;
      border-radius: 9px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .margin-btn.active {
      background: var(--sfc);
      color: #fff;
      border-color: var(--sfc);
    }

    .primary-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--sfc);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-btn:hover { background: var(--sfc-dark); }

    .secondary-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #fff;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .status-banner {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }

    .status-banner.show { display: block; }
    .status-banner.ok { background: var(--ok-soft); color: #065f46; border: 1px solid #a7f3d0; }
    .status-banner.warn { background: var(--warn-soft); color: #92400e; border: 1px solid #fde68a; }
    .status-banner.err { background: var(--bad-soft); color: #991b1b; border: 1px solid #fecaca; }

    details summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .field-gap { margin-top: 12px; }

    .person-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
